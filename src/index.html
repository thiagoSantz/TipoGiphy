<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>APIcomGiphy</title>
  </head>
  <body>
    <div class="main">
      <div class="icone-E-titulo">
        <img class="icone-titulo" src="img/img-magnifique.png" alt="Ícone" />
        <span class="titulo">Tipo o <em>Giphy</em></span>
      </div>
      <div class="input-E-botao">
        <input type="text" id="busca-input" placeholder="Busque aqui seu Gif" />
        <button class="busca-botao" aria-label="Buscar">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
      <div class="conteiner-gifs"></div>
    </div>
  </body>
</html>
